<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-project-{{ project.id }}"
            aria-label="Delete {{ project.title }}"
            title="Delete works">
        Delete Works
    </button>
</p>
<div id="delete-works-{{ project.id }}"
     class="works-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-works-title-{{ project.id }}">
    <button type="button"
            class="works-delete-modal__backdrop"
            popovertarget="delete-works-{{ project.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="works-delete-modal__content">
        <button type="button"
                class="works-delete-modal__close"
                popovertarget="delete-works-{{ project.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus"></button>
        <h2 id="delete-works-title-{{ project.id }}">Delete Works?</h2>
        <p>
            Are you sure you want to delete  
            <strong>{{ project.title }}</strong>?
        </p>
        <div class="works-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-works-{{ project.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_work' project.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
